<div class="container my-5">
  <h2 class="text-center mb-5 text-dark fw-bold">{{ titulo }}</h2>
  <div class="row g-4">
    <div class="col-md-6" *ngFor="let item of getParsed(opinionesJson || testimoniosJson)">
      <div class="card h-100 border-0 shadow-sm p-4 bg-white">
        <div class="d-flex align-items-center mb-3">
          <img *ngIf="item.foto" [src]="item.foto" class="rounded-circle me-3" style="width: 50px; height: 50px; object-fit: cover;">
          <div>
            <h5 class="m-0 fw-bold">{{ item.nombre }}</h5>
            <small class="text-warning">★ {{ item.rating || 5 }} / 5</small>
          </div>
        </div>
        <p class="text-muted italic m-0">"{{ item.comentario || item.testimonio }}"</p>
      </div>
    </div>
  </div>
</div>
