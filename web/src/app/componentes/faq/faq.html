<div class="container my-5">
  <h2 class="text-center mb-4 text-dark fw-bold">{{ titulo }}</h2>
  <div class="accordion" id="accordionFaq">
    <div class="accordion-item" *ngFor="let item of getParsed(faqsJson); let i = index">
      <h2 class="accordion-header" [id]="'heading' + i">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" [attr.data-bs-target]="'#collapse' + i">
          {{ item.pregunta }}
        </button>
      </h2>
      <div [id]="'collapse' + i" class="accordion-collapse collapse" data-bs-parent="#accordionFaq">
        <div class="accordion-body text-secondary">
          {{ item.respuesta }}
        </div>
      </div>
    </div>
  </div>
</div>
