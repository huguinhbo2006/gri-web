<div class="container my-5">
  <div class="row align-items-center" [class.flex-row-reverse]="alineacion === 'derecha'">
    <div class="col-md-6 mb-4 mb-md-0 text-center">
      <img [src]="imagenUrl" alt="Imagen descriptiva" class="img-fluid rounded shadow" style="max-height: 400px; object-fit: cover; width: 100%;">
    </div>
    <div class="col-md-6">
      <h2 class="display-5 fw-bold text-dark mb-3">{{ titulo }}</h2>
      <p class="lead text-muted" style="white-space: pre-line;">{{ contenido }}</p>
    </div>
  </div>
</div>
