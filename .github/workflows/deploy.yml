name: Build and Deploy web application

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Angular Project
      run: npm run build:prod

    - name: Deploy to Hostinger via SFTP (SSH)
      uses: easingthemes/ssh-deploy@v5.1.0
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ secrets.SSH_HOST }}
        REMOTE_USER: ${{ secrets.SSH_USER }}
        REMOTE_PORT: ${{ secrets.SSH_PORT || '65002' }} # Usa el puerto secreto o por defecto el 65002 de Hostinger
        TARGET: ${{ secrets.SSH_TARGET || '/' }}
        SOURCE: dist/web/browser/
        ARGS: "-rlgoDzvc --delete --exclude=prueba --exclude=dashboard --exclude=quizes --exclude=app --exclude=licencias"
